# Build all three implementations, run the 14-behaviour functional check and one quick
# Lighthouse sanity run per implementation. Runs on every push and can be started by hand.
name: CI

on:
  push:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check FakeStore API from the runner
        run: |
          for path in /products/1 /products/categories; do
            code=$(curl -s -o /tmp/fs.json -w "%{http_code}" -m 20 "https://fakestoreapi.com$path" || echo 000)
            echo "::notice title=FakeStore $path::HTTP $code, $(head -c 120 /tmp/fs.json | tr -d '\n')"
          done
      - run: npm ci
      - name: Build A – Module Federation
        run: npm run a:build
      - name: Build B – Single-SPA
        run: npm run b:build
      - name: Build C – Next.js RSC
        run: npm run c:build
      - name: Start all servers
        run: bash tools/start-all.sh
      - name: Functional check (A, B, C)
        working-directory: tests
        run: |
          npm ci
          npx playwright install --with-deps chromium
          FT_TIMEOUT=20000 node functional.mjs
      - name: Lighthouse sanity run (Home, Fast 4G, A/B/C)
        working-directory: bench
        run: |
          npm ci
          node run.mjs --runs 1 --impl A,B,C --network fast-4g --pages home --out results/ci
          cat results/ci/results.csv
          while IFS=, read -r ts impl strategy page network run url score fcp lcp tbt cls rest; do
            [ "$impl" = impl ] || echo "::notice title=Lighthouse $impl $page $network::score $score FCP $fcp ms LCP $lcp ms TBT $tbt ms CLS $cls"
          done < results/ci/results.csv
          ! grep -q EXCEPTION results/ci/results.csv
      - name: Server logs
        if: always()
        run: tail -n 30 logs/*.log
